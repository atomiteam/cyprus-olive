  <line x1="80" y1="148" x2="1320" y2="148" class="line"/>
  <text x="86" y="180" class="tiny">Çeşit</text><text x="355" y="180" class="tiny">Yaprak</text><text x="675" y="180" class="tiny">Meyve</text><text x="1010" y="180" class="tiny">Çekirdek</text>

