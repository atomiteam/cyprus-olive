<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Zeytin Çeşitleri Karşılaştırma Kataloğu</title>
  <desc id="desc">Ladoelia, Kato Drys, Korakou, Gemlik, Manzanilla, Picual, Arbequina, Kalamata ve Koroneiki için yaprak, meyve ve çekirdek karşılaştırması.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ec}.paper{fill:#fffdf7;stroke:#d9ddcf;stroke-width:2}.head{fill:#244a35}.sub{fill:#6a766c}.line{stroke:#dfe3d8;stroke-width:1.5}.band{fill:#eef2e8}.name{font:700 27px Georgia,serif;fill:#23462f}.small{font:17px Arial,sans-serif;fill:#3f4d43}.tiny{font:14px Arial,sans-serif;fill:#69756d}.leaf{fill:#647b55;stroke:#3e5c3b;stroke-width:2}.leaf2{fill:#aeb9a2;stroke:#73806f;stroke-width:2}.fruit{fill:#9ead4e;stroke:#637337;stroke-width:2}.fruit-dark{fill:#4d344c;stroke:#332534;stroke-width:2}.stone{fill:#b89b72;stroke:#8d704f;stroke-width:2}.vein{stroke:#6f573d;stroke-width:2;fill:none;opacity:.8}
    </style>
  </defs>
  <rect class="bg" width="1400" height="980"/>
  <rect class="paper" x="35" y="30" width="1330" height="920" rx="24"/>
